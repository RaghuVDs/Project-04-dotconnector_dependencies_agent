[pytest]
# Segregated suite: unit (pure, isolated) / functional (one component, mocked
# externals) / integration (real components wired together).
testpaths = tests
# Coverage is intentionally NOT forced here, so the suite runs with only pytest
# installed. To measure coverage (needs pytest-cov):
#   pytest --cov=src --cov=mock_dotconnector --cov=run_poc --cov-report=term-missing
addopts =
    -ra
    --strict-markers
markers =
    unit: pure functions / single class, no I/O, no network, no subprocess
    functional: one component end-to-end with externals mocked
    integration: multiple real components wired together (git, subprocess, real tools)
