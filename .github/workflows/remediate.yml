name: dependency-autofix

# Event-driven so fixes land within minutes of a new finding, with a nightly
# backstop. In prod, DotConnector's webhook fires repository_dispatch.
on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"          # nightly sweep (UTC)
  repository_dispatch:
    types: [dotconnector-finding] # webhook trigger from DotConnector

# Least privilege: the agent may push branches and open PRs -- never merge.
permissions:
  contents: write
  pull-requests: write

concurrency:                       # one run at a time per ref (idempotency)
  group: autofix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: pip install -r requirements.txt

      - name: Run remediation agent
        env:
          # Dev/POC: free Groq. Prod: switch to ANTHROPIC_API_KEY + the Claude
          # Agent SDK (see CLAUDE.md "Production migration").
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER || 'groq' }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # built-in token has the contents+PR scopes granted above
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python run_poc.py \
            --in-place --mode github \
            --repo . --repo-slug "${{ github.repository }}"

      - name: Upload remediation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: remediation-report
          path: .run/
