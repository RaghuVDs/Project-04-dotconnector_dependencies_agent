name: autofix-pr-gate

# Runs on the PRs the agent opens. This is the SAME passing check the agent ran,
# re-enforced in real CI (defense in depth) before a human approves. The agent
# can open PRs but this gate + required review is what guards merge.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

jobs:
  gate:
    # only gate the agent's branches; normal PRs use your usual CI
    if: startsWith(github.head_ref, 'autofix/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install target deps
        run: pip install -r requirements.txt

      - name: Resolver check (real resolver, not the POC proxy)
        run: pip install --dry-run -r requirements.txt

      - name: Run tests (the tests_pass gate)
        run: python -m pytest -q

      - name: Label outcome
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const label = ok ? 'ci-green' : 'needs-human';
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              labels: [label],
            });
            // NOTE: no auto-merge. A human (CODEOWNERS) must approve and merge.
