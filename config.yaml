# Remediation policy. Deterministic and auditable -- the agent operates within
# these bounds. Change here, not in code.

base_branch: main

policy:
  # bump sizes the agent may fix automatically (others -> draft / escalate)
  auto_deltas: [patch, minor]
  # never auto-apply major bumps without a human (open a draft instead)
  allow_major_auto: false
  # bounded self-healing retries (candidate versions) before giving up.
  # The candidate order is: recommended version, then each PREVIOUS release
  # stepping down the version ladder (e.g. 3.1.3 -> 3.1.2 -> 3.1.1).
  max_attempts: 3
  # self-healing fallback: if the recommended version fails validation, step DOWN
  # the version ladder (previous release, then the one before it) before giving
  # up, staying strictly above the declared pin. If every candidate fails, the
  # manifest is restored to the declared version and an escalation comment is
  # attached for a human. Set false to try only the recommended version.
  fallback_to_previous: true
  # a stepped-down version is BELOW the scanner's recommendation, so it may not
  # actually remediate the advisory: open it as a DRAFT for a human to confirm
  # rather than auto-merging. Set false to auto-ship stepped-down versions.
  draft_below_recommended: true
  # blast-radius cap: most PRs to open in a single run
  max_prs_per_run: 10
  # cost guard: most LLM calls allowed per finding
  max_llm_calls_per_finding: 6

# How the validation gate PROVES a bump is safe before opening a PR.
# Defaults are "real": resolve the dependency graph and run the tests against
# the actually-installed bump. For a fast, fully-offline run with no pip/venv
# subprocess, set: resolver: registry  +  isolation: none
validation:
  # registry  -> fast proxy: every '==' pin must exist on PyPI
  # pip_dry_run -> real resolver: `pip install --dry-run` must resolve the graph
  resolver: pip_dry_run
  # none -> tests run in the agent's own env (bump not installed)
  # venv -> tests run in a throwaway venv with the bumped deps installed
  isolation: venv
  # {python} is substituted with the venv interpreter (or sys.executable)
  test_command: ["{python}", "-m", "pytest", "-q"]
  # seconds before a resolve/install is abandoned
  resolve_timeout: 120
  # seconds before the test run is abandoned
  test_timeout: 300
  # reuse one venv across all findings/attempts in a run (faster)
  reuse_venv: true
